description: "Support Bot Eval (Bedrock)"

prompts:
  - file://./prompt.txt

providers:
  - id: bedrock:us.anthropic.claude-haiku-4-5-20251001-v1:0
    config:
      region: us-east-1

tests: tests.csv

defaultTest:
  assert:
    - type: is-json
    - type: regex
      value: '"category"\s*:\s*"{{expected_category}}"'
    - type: regex
      value: '"priority"\s*:\s*"{{expected_priority}}"'
